[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcqgen2"
version = "0.1.0b1"
description = "Generate and practice source-grounded questions from PDF files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai==3.19.2",
  "pydantic==2.13.5",
  "PyMuPDF==1.28.2",
  "reportlab==5.0.1",
  "streamlit==1.64.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["mcqgen2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
